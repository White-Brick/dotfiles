# ============================================
# OSC 52 Copy Mode Configuration
# ============================================
# 自定义 OSC52 实现，绕过 tmux 原生 OSC52 的已知问题
# 通过外部脚本避免 copy-pipe 内联命令的引号转义问题

# ----------------------------------------
# 基础设置
# ----------------------------------------
set-window-option -g mode-keys vi

# 鼠标拖拽选中即复制
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '~/.config/tmux/osc52-copy.sh'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '~/.config/tmux/osc52-copy.sh'

# ----------------------------------------
# 关闭 tmux 原生 OSC52（由自定义脚本处理）
# ----------------------------------------
set -g set-clipboard off
set -g allow-passthrough on

# ----------------------------------------
# Vi 模式绑定
# ----------------------------------------
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '~/.config/tmux/osc52-copy.sh'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel '~/.config/tmux/osc52-copy.sh'

# ----------------------------------------
# Emacs 模式绑定
# ----------------------------------------
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel '~/.config/tmux/osc52-copy.sh'
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel '~/.config/tmux/osc52-copy.sh'
