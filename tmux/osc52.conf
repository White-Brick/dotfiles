# ============================================
# OSC 52 Copy Mode Configuration
# ============================================
# 此文件包含所有与 copymode 相关的配置
# 用于在 SSH 环境下通过 OSC 52 复制到本地剪切板

# ----------------------------------------
# 基础设置
# ----------------------------------------
set-window-option -g mode-keys vi

# 禁用鼠标拖拽自动复制
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

# ----------------------------------------
# OSC 52 复制命令（核心配置）
# ----------------------------------------
set -g @osc52-copy 'if [ -n "$SSH_TTY" ]; then printf "\033]52;c;%s\007" "$(cat | base64 -w0)" > "$SSH_TTY"; fi'

# ----------------------------------------
# Vi 模式绑定
# ----------------------------------------
bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel "#{@osc52-copy}"

bind-key -T copy-mode-vi Enter \
  send-keys -X copy-pipe-and-cancel "#{@osc52-copy}"

# ----------------------------------------
# Emacs 模式绑定
# ----------------------------------------
bind-key -T copy-mode y \
  send-keys -X copy-pipe-and-cancel "#{@osc52-copy}"

bind-key -T copy-mode Enter \
  send-keys -X copy-pipe-and-cancel "#{@osc52-copy}"

# ----------------------------------------
# 可选配置（默认注释）
# ----------------------------------------
# 启用系统剪切板集成
# set-option -g set-clipboard on
set-option -g allow-passthrough on
# set-option -g terminal-overrides ',tmux-256color:Tc'
