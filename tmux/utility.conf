# Display lazygit (prefix + g)
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit
# Display htop (prefix + p)
# bind p display-popup -d '#{pane_current_path}' -w80% -h80% -E htop
# Quick note (prefix + N)
bind N display-popup -w60% -h60% -E "echo '# $(date)' >> /tmp/tmux-notes.md; nvim /tmp/tmux-notes.md"
# Quick search file (prefix + F)
bind F display-popup -d '#{pane_current_path}' -w80% -h80% -E "fzf --preview 'cat {}'"

