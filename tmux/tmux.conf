set -g default-terminal "tmux-256color"
set -su terminal-overrides
set -s terminal-features[100] 'xterm-256color:RGB:clipboard'
set -g allow-passthrough on
set -g set-clipboard on

# action key
unbind C-b
set-option -g prefix C-t
bind C-t send-prefix
set-option -g repeat-time 400
set-option -g focus-events on

#### Key bindings

set-window-option -g mode-keys vi

# spilit-window
unbind '"'
unbind '%'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 新窗口只创建单个 pane
bind c new-window -c "#{pane_current_path}"

# 预设布局：左约 67%、右约 33% 上下等分（覆盖默认 tiled）
bind M-5 if-shell '[ #{window_panes} -eq 1 ]' \
    'split-window -h -p 33 -c "#{pane_current_path}" ; split-window -v -p 50 -c "#{pane_current_path}" ; select-pane -t :.1' \
    'setw main-pane-width 67% ; select-layout main-vertical'

#bind t send-key C-t
# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory
bind o run-shell 'open #{q:pane_current_path}'
# kill all panes except the currently active pane
bind -r e kill-pane -a
# Seamless Vim-Tmux navigation (Alt + hjkl)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind Tab last-window        # 快速切换到上一个窗口
bind s choose-tree -Zs      # 可视化选择会话

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# # Resizing pane
# bind -r C-k resize-pane -U 5
# bind -r C-j resize-pane -D 5
# bind -r C-h resize-pane -L 5
# bind -r C-l resize-pane -R 5
# Resizing pane
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

#### basic settings

set-option -g status-justify "left"
#set-option utf8-default on
set-option -g mouse on
#set-window-option -g utf8 on
# look'n feel
set-option -g status-fg cyan
set-option -g status-bg black
# set -g window-style fg=colour10,bg=default
# set -g window-active-style fg=colour12,bg=default
set-option -g history-limit 8192
#
set -sg escape-time 0

#### COLOUR

# default statusbar colors
set-option -g status-style bg=colour235,fg=colour136,default

# default window title colors
set-window-option -g window-status-style fg=colour244,bg=colour234,dim

# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default,bright

# pane border
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour220,bg=colour235

# message text
set-option -g message-style bg=colour235,fg=colour166

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#h"

setw -g aggressive-resize on

# user plugins
# tmux-resurrect & tmux-continuum
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '60'
# set -g @continuum-restore 'on'

# 默认启动 tmux 时按比例分割窗口
# new-session -s mysession \; split-window -v -p 30 \;

# start window and pane numbering at 1
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1
unbind 0

source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

# Bootstrap TPM and plugins once on a fresh machine.
if-shell 'test ! -d ~/.config/tmux/plugins/tpm' \
    "run-shell 'mkdir -p ~/.config/tmux/plugins && git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run -b '~/.config/tmux/plugins/tpm/tpm'
