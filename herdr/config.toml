onboarding = false

[theme]
name = "terminal"
auto_switch = false

[terminal]
new_cwd = "follow"

[ui]
prompt_new_tab_name = false

# tmux colour220 金色活跃边框与高亮
accent = "#ffd700"
# Agent 状态指示器使用具象静态符号
status_indicators = "symbols"

# 无 pane 间隙、无外框
pane_gaps = true
pane_outer_borders = true

[keys]
prefix = "ctrl+t"

# Splits
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
new_tab = "prefix+c"

# Pane focus
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

# Resize without entering resize mode.
resize_pane_left = "prefix+left"
resize_pane_down = "prefix+down"
resize_pane_up = "prefix+up"
resize_pane_right = "prefix+right"


# Pane swap: 对应 tmux prefix+{ / prefix+}
swap_pane_left = ["prefix+{", "prefix+shift+["]
swap_pane_right = ["prefix+}", "prefix+shift+]"]

reload_config = "prefix+r"
workspace_picker = "prefix+w"
last_pane = "prefix+tab"
goto = "prefix+s"
settings = "prefix+comma"
open_notification_target = "prefix+shift+o"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+o"
type = "shell"
command = "bash -lc 'cwd=$(herdr pane current | jq -r .result.pane.cwd); if [ \"$(uname -s)\" = Darwin ]; then open \"$cwd\"; else xdg-open \"$cwd\"; fi'"
description = "open current pane directory"

[experimental]
# 在 prefix 激活时临时切换系统输入法为 ASCII 模式，避免中文输入法吞快捷键
switch_ascii_input_source_in_prefix = true

# 暴露聚焦窗格光标以修复 macOS 输入法中文候选框跟踪定位
# reveal_hidden_cursor_for_cjk_ime = true
# cjk_ime_agents = ["claude", "codex", "gemini", "opencode", "pi", "grok"]
